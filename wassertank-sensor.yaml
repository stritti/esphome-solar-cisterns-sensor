substitutions:
# ============================================================================
# POWER MODE
# ============================================================================
# "DEBUG" = Board stays awake, USB logging active (for development)
# "NONE"  = Deep sleep mode for solar operation (production)
  DEBUG_MODE: "NONE"

# ============================================================================
# HARDWARE CONFIGURATION (FireBeetle 2 ESP32-C6)
# ============================================================================
# Optional sensor power control (BC327-40 PNP; 4.7kΩ GPIO-to-Base, 10kΩ Base-to-3V3)
# Without power gating: connect sensor VCC directly to 3V3 and leave this GPIO unconnected.
# Safe GPIOs: GPIO1, GPIO2, GPIO3, GPIO20, GPIO21, GPIO22, GPIO23
# GPIO16/17 are reserved for UART!
  SENSOR_POWER_PIN: "GPIO21"
  
# Battery voltage measurement (Analog)
# FireBeetle 2 C6: GPIO0, GPIO1, GPIO2, GPIO3 with internal 1.1V reference
  BATTERY_ADC_PIN: "GPIO0"
  
# Solar panel voltage (optional, if available)
  SOLAR_ADC_PIN: "GPIO1"

# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================
  WIFI_STATIC_IP: "192.168.178.46"
  WIFI_GATEWAY: "192.168.178.1"
  WIFI_SUBNET: "255.255.255.0"
  
  # Fallback WiFi network (optional) - leave empty to disable
  WIFI_SSID_FALLBACK: ""
  WIFI_PASSWORD_FALLBACK: ""

# ============================================================================
# TANK CONFIGURATION
# ============================================================================
# Tank type: "ROUND" or "RECTANGLE"
  TANK_TYPE: "RECTANGLE"
  
# Distance from sensor to absolute tank bottom when empty (in meters)
  TANK_TOTAL_DEPTH: "1.65"
  
# Maximum capacity in liters (safety limit)
  TANK_MAX_LITERS: "650"
  
# For ROUND tanks: Radius in meters (inner diameter / 2)
  TANK_RADIUS: "0.50"
  
# For RECTANGLE tanks: Inner dimensions in meters
  TANK_LENGTH: "0.77"
  TANK_WIDTH: "0.57"

# ============================================================================
# BATTERY CONFIGURATION
# ============================================================================
# Empty battery voltage (device shutdown threshold)
  BATTERY_MIN_VOLTAGE: "3.0"
# Full battery voltage (Li-Ion typical 4.2V)
  BATTERY_MAX_VOLTAGE: "4.2"
# Critical battery voltage for emergency sleep
  BATTERY_CRITICAL_VOLTAGE: "3.2"

# ============================================================================
# SOLAR CONFIGURATION (optional)
# ============================================================================
# Solar panel voltage divider factor (if SOLAR_ADC_PIN is active)
# 33k from Solar+ to GPIO1, 10k from GPIO1 to GND:
# (33k + 10k) / 10k = 4.3
  SOLAR_VOLTAGE_DIVIDER: "4.3"

# ============================================================================
# POWER OPTIMIZATION
# ============================================================================
# Warmup time for ultrasonic sensor (seconds) - 5s is sufficient for A02YYUW
  ULTRASONIC_WARMUP_TIME: "5"
  
# Measurement processing time (seconds)
  MEASUREMENT_PROCESSING_TIME: "2"

# Default sleep duration (minutes) - can be overridden by HA
  DEFAULT_SLEEP_MINUTES: "30"

# OTA Wake Window (seconds) - Time window for OTA updates after waking
  OTA_WAKE_WINDOW: "300"

# CPU frequency for power saving (80MHZ or 160MHZ)
  CPU_FREQUENCY: "80MHZ"

# ============================================================================
# FIRMWARE SELF-UPDATE (HTTP OTA)
# ============================================================================
# Current firmware version - MUST be bumped on every release
  FIRMWARE_VERSION: "1.0.0"

# Manifest URL (JSON: {"name": "...", "version": "...", "url": "<firmware.bin>"})
# Example hosting in Home Assistant: copy manifest.json + .bin to /config/www/wassertank-sensor/
  UPDATE_MANIFEST_URL: "http://homeassistant.local:8123/local/wassertank-sensor/manifest.json"

# ============================================================================
# ESPHOME CONFIGURATION
# ============================================================================
esphome:
  name: wassertank-sensor
  friendly_name: Wassertank Sensor
  area: Garten
  min_version: 2026.8.0
  project:
    name: solar-cisterns.wassertank-sensor
    version: ${FIRMWARE_VERSION}

  on_boot:
    priority: 800  # Very high priority: executed before logger starts
    then:
      # 1. Turn on sensor power
      - switch.turn_on: sensor_power
      
      # 2. Wait for sensor stabilization (A02YYUW warmup)
      - delay: ${ULTRASONIC_WARMUP_TIME}s
      
      # 3. Wait for data processing and transmission
      - delay: ${MEASUREMENT_PROCESSING_TIME}s

      # 3a. Measurement is complete: remove sensor power before WiFi/OTA waits
      - switch.turn_off: sensor_power
      
      # 3b. Force-read battery & solar so the power checks below see fresh values
      # (ADC default update_interval is 60s - without this, has_state() may be false)
      - component.update: battery_voltage
      - component.update: solar_voltage
      
      # 4. Check for low battery condition and enter emergency mode if critical
      - if:
          condition:
            and:
              - lambda: 'return id(battery_voltage).has_state();'
              - lambda: 'return id(battery_voltage).state < ${BATTERY_CRITICAL_VOLTAGE};'
          then:
            - logger.log: "CRITICAL: Low battery detected - entering emergency sleep mode"
            - switch.turn_off: sensor_power
            - wifi.disable
            - deep_sleep.enter:
                id: deep_sleep_control
                sleep_duration: 24h
            - lambda: 'return;'  # Exit on_boot sequence
      
      # 5. Calculate adaptive sleep duration
      - lambda: |-
          uint32_t sleep_ms = ${DEFAULT_SLEEP_MINUTES} * 60 * 1000;
          
          // Override with Home Assistant input if available
          if (id(ha_sleep_duration).has_state() && !std::isnan(id(ha_sleep_duration).state) && id(ha_sleep_duration).state > 0) {
            sleep_ms = (uint32_t) (id(ha_sleep_duration).state * 60 * 1000);
          }
          
          // Adaptive sleep: shorter intervals when solar is available
          if (id(solar_voltage).has_state() && id(solar_voltage).state > 5.0) {
            sleep_ms = std::min(sleep_ms, (uint32_t)15 * 60 * 1000);
            ESP_LOGI("sleep", "Solar power detected - using shorter sleep interval");
          }
          
          // Low battery - extend sleep duration
          if (id(battery_voltage).has_state() && id(battery_voltage).state < ${BATTERY_CRITICAL_VOLTAGE} + 0.2) {
            sleep_ms = std::max(sleep_ms, (uint32_t)60 * 60 * 1000);
            ESP_LOGI("sleep", "Low battery - extending sleep duration");
          }
          
          id(deep_sleep_control).set_sleep_duration(sleep_ms);
      
      # 6. OTA window + automatic self-update
      # Stays awake if: OTA Wake Lock is ON OR solar power with battery >= 50%
      # (replaces the old fixed 03:00-03:10 night window - at night the battery
      #  is at its weakest, so OTA is done during sunny hours instead)
      - wait_until:
          condition:
            wifi.connected:
          timeout: 60s
      
      # Fresh manifest poll, then wait for the result (UNKNOWN = unreachable)
      - component.update: firmware_update
      - wait_until:
          condition:
            lambda: 'return id(firmware_update).state != update::UPDATE_STATE_UNKNOWN;'
          timeout: 20s
      
      - lambda: |-
          bool power_ok = id(solar_voltage).has_state() && id(solar_voltage).state > 5.0 &&
                          id(battery_charge_percent).has_state() && id(battery_charge_percent).state >= 50.0;
          
          if (power_ok) {
            ESP_LOGI("ota", "Solar power + battery >= 50%% - OTA window open");
            
            // Automatic self-update: only with a good power budget
            if (id(firmware_update).state == update::UPDATE_STATE_AVAILABLE) {
              ESP_LOGI("ota", "Firmware update available - installing now");
              id(firmware_update).perform(false);
              // perform() flashes and reboots; on success this line is never reached
            }
          }
          
          if (id(ota_wake_lock).state || power_ok) {
            ESP_LOGI("ota", "Staying awake for %d seconds for OTA", ${OTA_WAKE_WINDOW});
            delay(${OTA_WAKE_WINDOW} * 1000);
          }
      
      # 7. Safety: ensure sensor remains off before deep sleep
      - switch.turn_off: sensor_power
      
      # 8. Disable WiFi for deep sleep
      - wifi.disable
      
      # 9. Enter deep sleep (only in production mode)
      - if:
          condition:
            lambda: 'return std::string("${DEBUG_MODE}") == "NONE";'
          then:
            - deep_sleep.enter:
                id: deep_sleep_control

# ============================================================================
# ESP32 SPECIFIC CONFIGURATION
# ============================================================================
esp32:
  variant: esp32c6
  board: dfrobot_firebeetle2_esp32c6
  cpu_frequency: ${CPU_FREQUENCY}
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: SIZE

# ============================================================================
# DEEP SLEEP CONFIGURATION
# ============================================================================
deep_sleep:
  id: deep_sleep_control
  run_duration: ${ULTRASONIC_WARMUP_TIME}s

# ============================================================================
# LOGGER CONFIGURATION
# ============================================================================
logger:
  level: ${DEBUG_MODE}
  baud_rate: 0

# ============================================================================
# API FOR HOME ASSISTANT
# ============================================================================
api:
  encryption:
    key: "/JUP/LtiX5b9KApacnaQkBWx2xUE8YO2gHw6hAH+e5o="
  port: 6053
  reboot_timeout: 0s

# ============================================================================
# WIFI CONFIGURATION - Power Optimized
# ============================================================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: HIGH  # Maximum power saving for solar operation
  manual_ip:
    static_ip: ${WIFI_STATIC_IP}
    gateway: ${WIFI_GATEWAY}
    subnet: ${WIFI_SUBNET}

# ============================================================================
# OTA UPDATES (native ESPHome push + HTTP self-update pull)
# ============================================================================
ota:
  - platform: esphome
  - platform: http_request
    id: http_ota

# ============================================================================
# HTTP REQUEST CLIENT (required for HTTP OTA)
# ============================================================================
http_request:

# ============================================================================
# FIRMWARE UPDATE CHECK
# Polls the manifest on every wake cycle, exposes an Update entity in HA.
# Manifest format:
#   {"name": "Wassertank Sensor", "version": "1.0.1",
#    "url": "http://homeassistant.local:8123/local/wassertank-sensor/wassertank-sensor.bin"}
# ============================================================================
update:
  - platform: http_request
    id: firmware_update
    name: "Wassertank Firmware"
    source: ${UPDATE_MANIFEST_URL}
    ota_id: http_ota
    update_interval: 6h  # fallback poll; fresh poll is forced on every wake

# ============================================================================
# UART FOR ULTRASONIC SENSOR A02YYUW
# ============================================================================
uart:
  - id: uart_1
    baud_rate: 9600
    rx_pin: 17
    tx_pin: 16

# ============================================================================
# OPTIONAL POWER CONTROL FOR SENSOR (BC327-40 PNP HIGH-SIDE SWITCH)
# ============================================================================
switch:
  - platform: gpio
    pin:
      number: ${SENSOR_POWER_PIN}
      inverted: true  # BC327-40 PNP high-side: physical LOW = sensor ON
    id: sensor_power
    restore_mode: ALWAYS_OFF  # physical HIGH; external 10k pull-up keeps sensor OFF
    internal: true

  # OTA Wake Lock - keeps device awake for OTA updates
  # Visible in HA as "Wassertank OTA Wake Lock"
  - platform: template
    name: "Wassertank OTA Wake Lock"
    id: ota_wake_lock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - logger.log: "OTA wake lock engaged - staying awake for OTA"
    turn_off_action:
      - logger.log: "OTA wake lock released"

# ============================================================================
# SENSORS
# ============================================================================
sensor:
  
  # ==========================================================================
  # 1. BATTERY VOLTAGE
  # ==========================================================================
  - platform: adc
    pin: ${BATTERY_ADC_PIN}
    name: "Wassertank Batterie Spannung"
    id: battery_voltage
    unit_of_measurement: "V"
    icon: "mdi:battery"
    accuracy_decimals: 2
    attenuation: 12db  # GPIO0 sees up to about 2.1V from a full 4.2V cell
    filters:
      # DFRobot specifies a 1:1 on-board divider: battery voltage = pin voltage × 2
      - multiply: 2.0
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    on_value:
      then:
        - lambda: |-
            float raw_voltage = x;
            float min_volt = ${BATTERY_MIN_VOLTAGE};
            float max_volt = ${BATTERY_MAX_VOLTAGE};
            float charge_percent = 0.0;
            
            if (raw_voltage <= min_volt) {
              charge_percent = 0.0;
            } else if (raw_voltage >= max_volt) {
              charge_percent = 100.0;
            } else {
              charge_percent = (raw_voltage - min_volt) / (max_volt - min_volt) * 100.0;
            }
            
            if (charge_percent < 0.0) charge_percent = 0.0;
            if (charge_percent > 100.0) charge_percent = 100.0;
            
            id(battery_charge_percent).publish_state(charge_percent);

  - platform: template
    name: "Wassertank Batterie Ladegrad"
    id: battery_charge_percent
    unit_of_measurement: "%"
    icon: "mdi:battery-charging"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement

  # ==========================================================================
  # 2. SOLAR PANEL VOLTAGE (optional)
  # ==========================================================================
  - platform: adc
    pin: ${SOLAR_ADC_PIN}
    name: "Wassertank Solarzelle Spannung"
    id: solar_voltage
    unit_of_measurement: "V"
    icon: "mdi:solar-panel"
    accuracy_decimals: 2
    attenuation: 12db  # 5V panel / 4.3 = about 1.16V at GPIO1
    filters:
      - multiply: ${SOLAR_VOLTAGE_DIVIDER}
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1

  # ==========================================================================
  # 3. ULTRASONIC SENSOR A02YYUW
  # ==========================================================================
  - platform: a02yyuw
    id: sensor_a02yyuw_1
    uart_id: uart_1
    name: "Wassertank Distanz"
    unit_of_measurement: "m"
    icon: "mdi:ruler"
    accuracy_decimals: 3
    filters:
      # Component reports millimeters - convert to meters FIRST,
      # otherwise the range check below rejects every valid reading.
      - multiply: 0.001
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
      - lambda: |-
          float distance = x;
          // Validate distance readings (now in meters)
          if (std::isnan(distance) || distance < 0.03 || distance > 4.50) {
            return NAN;
          }
          return distance;
    on_value:
      then:
        - lambda: |-
            float distance = x;
            float max_depth = ${TANK_TOTAL_DEPTH};
            float water_level = max_depth - distance;
            if (water_level < 0.0) water_level = 0.0;
            if (water_level > max_depth) water_level = max_depth;
            
            float liters = 0.0;
            std::string tank_type = "${TANK_TYPE}";
            
            if (tank_type == "ROUND") {
              float radius = ${TANK_RADIUS};
              liters = 3.14159265 * radius * radius * water_level * 1000.0;
            } 
            else if (tank_type == "RECTANGLE") {
              float length = ${TANK_LENGTH};
              float width = ${TANK_WIDTH};
              liters = length * width * water_level * 1000.0;
            }
            
            float max_liters = ${TANK_MAX_LITERS};
            if (liters > max_liters) liters = max_liters;
            if (liters < 0.0) liters = 0.0;
            
            // Publish calculated liters
            id(wassertank_liter).publish_state(liters);
            
            // Store previous distance for validation
            id(previous_distance).publish_state(distance);
            
            // If not in debug mode, prepare deep sleep
            if (std::string("${DEBUG_MODE}") == "NONE") {
              uint32_t sleep_ms = ${DEFAULT_SLEEP_MINUTES} * 60 * 1000;
              
              // Override with Home Assistant input if available
              if (id(ha_sleep_duration).has_state() && !std::isnan(id(ha_sleep_duration).state) && id(ha_sleep_duration).state > 0) {
                sleep_ms = (uint32_t) (id(ha_sleep_duration).state * 60 * 1000);
              }
              
              // Adaptive sleep based on solar voltage
              if (id(solar_voltage).has_state() && id(solar_voltage).state > 5.0) {
                sleep_ms = std::min(sleep_ms, (uint32_t)15 * 60 * 1000);  // Max 15 minutes
              }
              
              // Low battery - extend sleep duration
              if (id(battery_voltage).has_state() && id(battery_voltage).state < ${BATTERY_CRITICAL_VOLTAGE} + 0.2) {
                sleep_ms = std::max(sleep_ms, (uint32_t)60 * 60 * 1000);  // Min 1 hour
              }
              
              id(deep_sleep_control).set_sleep_duration(sleep_ms);
              id(deep_sleep_control).setup();
            }

  # Previous distance for validation
  - platform: template
    name: "Wassertank Distanz Vorherig"
    id: previous_distance
    unit_of_measurement: "m"
    icon: "mdi:ruler"
    accuracy_decimals: 3
    internal: true

  # ==========================================================================
  # 4. TEMPLATE SENSORS FOR HOME ASSISTANT
  # ==========================================================================
  - platform: template
    name: "Wassertank Inhalt"
    id: wassertank_liter
    unit_of_measurement: "l"
    icon: "mdi:water"
    accuracy_decimals: 1
    device_class: ""
    state_class: measurement

  # Sleep duration from Home Assistant
  - platform: homeassistant
    id: ha_sleep_duration
    entity_id: input_number.wassertank_schlafdauer
    internal: true
