<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" style="background:#f8fafc; font-family: Arial, sans-serif;">
  <defs>
    <pattern id="breadboardHoles" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2.2" fill="#1f2937" opacity="0.9"/>
      <circle cx="9" cy="9" r="1.1" fill="#4b5563"/>
    </pattern>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="680" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>

  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Breadboard Build — Water Tank Sensor (Fritzing-Style)</text>
  <text x="500" y="48" text-anchor="middle" font-size="11" fill="#6b7280">FireBeetle 2 ESP32-C6 • A02YYUW • IRLML6401 • 18650 • Solar divider 10k/33k • Wire 1:1, mind colors!</text>

  <!-- Breadboard -->
  <g id="breadboard">
    <rect x="120" y="100" width="560" height="340" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <rect x="130" y="115" width="540" height="18" rx="4" fill="#dc2626" opacity="0.85"/>
    <text x="400" y="128" text-anchor="middle" font-size="8" font-weight="700" fill="white">+ (RED RAIL) — 3V3</text>
    <rect x="130" y="135" width="540" height="18" rx="4" fill="#1e40af" opacity="0.85"/>
    <text x="400" y="148" text-anchor="middle" font-size="8" font-weight="700" fill="white">− (BLUE RAIL) — GND</text>
    <!-- Main area holes -->
    <rect x="140" y="165" width="520" height="170" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="145" y="170" width="510" height="160" fill="url(#breadboardHoles)" opacity="0.35"/>
    <!-- Center trench -->
    <rect x="140" y="335" width="520" height="12" rx="2" fill="#1f2937"/>
    <rect x="145" y="352" width="510" height="70" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="150" y="357" width="500" height="60" fill="url(#breadboardHoles)" opacity="0.35"/>
    <text x="400" y="440" text-anchor="middle" font-size="9" fill="#9ca3af">Breadboard — each 5-hole row is connected (mind the trench)</text>
  </g>

  <!-- FireBeetle on breadboard -->
  <g id="firebeetle">
    <rect x="200" y="175" width="360" height="115" rx="6" fill="url(#boardGrad)" stroke="#030712" stroke-width="2"/>
    <rect x="210" y="185" width="340" height="22" rx="4" fill="#374151"/>
    <text x="380" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="white">FireBeetle 2 ESP32-C6 (DFR1075)</text>
    <text x="380" y="207" text-anchor="middle" font-size="7" fill="#9ca3af">USB-C oben • PH2.0 unten • Antenne rechts</text>
    <!-- Pins left side -->
    <g font-size="7" fill="white">
      <rect x="185" y="220" width="38" height="9" rx="2" fill="#eab308" stroke="#a16207"/><text x="204" y="227" text-anchor="middle" font-weight="700" fill="#111827">GPIO16</text>
      <rect x="185" y="232" width="38" height="9" rx="2" fill="#16a34a" stroke="#15803d"/><text x="204" y="239" text-anchor="middle" font-weight="700" fill="white">GPIO17</text>
      <rect x="185" y="244" width="38" height="9" rx="2" fill="#7c3aed"/><text x="204" y="251" text-anchor="middle" font-weight="700" fill="white">GPIO21</text>
      <rect x="185" y="256" width="38" height="9" rx="2" fill="#2563eb"/><text x="204" y="263" text-anchor="middle" font-weight="700" fill="white">GPIO0</text>
      <rect x="185" y="268" width="38" height="9" rx="2" fill="#ea580c"/><text x="204" y="275" text-anchor="middle" font-weight="700" fill="white">GPIO1</text>
    </g>
    <!-- Pins right side -->
    <g font-size="7" fill="white">
      <rect x="537" y="220" width="38" height="9" rx="2" fill="#111827"/><text x="556" y="227" text-anchor="middle" font-weight="700">GND</text>
      <rect x="537" y="232" width="38" height="9" rx="2" fill="#dc2626"/><text x="556" y="239" text-anchor="middle" font-weight="700">3V3</text>
      <rect x="537" y="244" width="38" height="9" rx="2" fill="#2563eb"/><text x="556" y="251" text-anchor="middle" font-weight="700">BAT+</text>
      <rect x="537" y="256" width="38" height="9" rx="2" fill="#111827"/><text x="556" y="263" text-anchor="middle" font-weight="700">BAT−</text>
    </g>
    <!-- PH2 connector visual -->
    <rect x="360" y="285" width="40" height="16" rx="2" fill="white" stroke="#111827" stroke-width="1.2"/>
    <text x="380" y="295" text-anchor="middle" font-size="6" font-weight="700" fill="#111827">PH2.0</text>
    <!-- USB-C -->
    <rect x="365" y="170" width="30" height="8" rx="2" fill="#9ca3af" stroke="#4b5563"/>
  </g>

  <!-- MOSFET breakout on breadboard -->
  <g id="mosfet-breakout">
    <rect x="250" y="365" width="90" height="48" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="1.6"/>
    <text x="295" y="378" text-anchor="middle" font-size="8" font-weight="700" fill="#713f12">IRLML6401</text>
    <text x="295" y="386" text-anchor="middle" font-size="6" fill="#a16207">P-Ch Breakout</text>
    <rect x="260" y="390" width="18" height="14" rx="1" fill="#111827"/><text x="269" y="399" text-anchor="middle" font-size="6" fill="white">G</text>
    <rect x="286" y="390" width="18" height="14" rx="1" fill="#dc2626"/><text x="295" y="399" text-anchor="middle" font-size="6" fill="white">S</text>
    <rect x="312" y="390" width="18" height="14" rx="1" fill="#dc2626"/><text x="321" y="399" text-anchor="middle" font-size="6" fill="white">D</text>
    <!-- 10k pulldown -->
    <g transform="translate(245,398)">
      <rect x="0" y="0" width="10" height="18" rx="2" fill="#e0e7ff" stroke="#7c3aed" stroke-width="1"/><text x="5" y="28" text-anchor="middle" font-size="6" fill="#7c3aed">10k</text>
      <line x1="5" y1="18" x2="5" y2="28" stroke="#7c3aed" stroke-width="1.2"/>
      <line x1="5" y1="0" x2="-18" y2="0" stroke="#7c3aed" stroke-width="1.2"/>
    </g>
  </g>

  <!-- A02YYUW Sensor off-board (right) -->
  <g id="sensor">
    <rect x="740" y="140" width="180" height="220" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <ellipse cx="830" cy="170" rx="38" ry="22" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
    <ellipse cx="830" cy="170" rx="22" ry="12" fill="#374151"/><ellipse cx="830" cy="170" rx="8" ry="5" fill="#6b7280"/>
    <text x="830" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">A02YYUW</text>
    <text x="830" y="215" text-anchor="middle" font-size="7" fill="#4b5563">waterproof • UART 9600</text>
    <!-- Cable -->
    <rect x="800" y="222" width="60" height="10" rx="2" fill="#1f2937"/>
    <!-- 4 wires -->
    <rect x="785" y="235" width="18" height="8" rx="2" fill="#dc2626"/><text x="794" y="241" text-anchor="middle" font-size="6" font-weight="700" fill="white">VCC</text>
    <rect x="785" y="245" width="18" height="8" rx="2" fill="#111827"/><text x="794" y="251" text-anchor="middle" font-size="6" font-weight="700" fill="white">GND</text>
    <rect x="785" y="255" width="18" height="8" rx="2" fill="#eab308"/><text x="794" y="261" text-anchor="middle" font-size="6" font-weight="700" fill="#111827">RX</text>
    <rect x="785" y="265" width="18" height="8" rx="2" fill="#16a34a"/><text x="794" y="271" text-anchor="middle" font-size="6" font-weight="700" fill="white">TX</text>
    <text x="810" y="241" font-size="7" fill="#374151">Red</text><text x="810" y="251" font-size="7" fill="#374151">Black</text><text x="810" y="261" font-size="7" fill="#374151">Yellow</text><text x="810" y="271" font-size="7" fill="#374151">Green</text>
    <!-- IP67 badge -->
    <rect x="770" y="285" width="120" height="20" rx="10" fill="#15803d"/><text x="830" y="298" text-anchor="middle" font-size="8" font-weight="700" fill="white">IP67 • 3–450 cm</text>
    <text x="830" y="320" text-anchor="middle" font-size="7" fill="#6b7280">Mount vertically above water!</text>
  </g>

  <!-- Wires: Sensor VCC (red) via MOSFET -->
  <path d="M 803 239 H 580 V 397 H 321" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <circle cx="321" cy="397" r="3" fill="#dc2626"/>
  <!-- Sensor GND (black) -->
  <path d="M 803 249 H 680 V 430 H 200 V 430 H 185" fill="none" stroke="#111827" stroke-width="3"/>
  <!-- Sensor RX (yellow) from GPIO16 -->
  <path d="M 803 259 H 600 V 224 H 223" fill="none" stroke="#eab308" stroke-width="3"/>
  <!-- Sensor TX (green) to GPIO17 -->
  <path d="M 803 269 H 610 V 236 H 223" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="7 4"/>

  <!-- Power: 3V3 to MOSFET Source -->
  <path d="M 556 236 H 590 V 397 H 295" fill="none" stroke="#dc2626" stroke-width="3"/>
  <!-- GPIO21 to MOSFET Gate -->
  <path d="M 223 248 H 260" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <!-- GND rail to MOSFET pulldown -->
  <path d="M 227 402 H 245" fill="none" stroke="#111827" stroke-width="2.2" stroke-dasharray="4 3"/>

  <!-- Battery holder -->
  <g id="battery">
    <rect x="40" y="480" width="220" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="150" y="498" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">18650 Halter • PH2.0</text>
    <rect x="55" y="505" width="190" height="38" rx="4" fill="white" stroke="#93c5fd" stroke-width="1"/>
    <rect x="62" y="513" width="130" height="22" rx="11" fill="#dbeafe" stroke="#2563eb"/>
    <text x="127" y="528" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">18650 3.7V</text>
    <circle cx="200" cy="524" r="7" fill="#1e40af"/><text x="200" y="527" text-anchor="middle" font-size="7" fill="white">+</text>
    <text x="60" y="557" font-size="8" fill="#1e40af">PH2.0 Kabel → FireBeetle</text>
    <path d="M 150 543 V 560 H 380 V 298" fill="none" stroke="#2563eb" stroke-width="2.2"/>
    <path d="M 120 543 V 560 H 200 V 430" fill="none" stroke="#111827" stroke-width="2.2"/>
  </g>

  <!-- Solar + divider on breadboard area -->
  <g id="solar">
    <rect x="400" y="480" width="280" height="90" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
    <text x="540" y="498" text-anchor="middle" font-size="10" font-weight="700" fill="#9a3412">Solar-Panel 5–6V (optional)</text>
    <rect x="415" y="505" width="70" height="45" rx="4" fill="#ea580c" stroke="#9a3412"/><g fill="white" opacity="0.9"><rect x="422" y="512" width="6" height="30" rx="1"/><rect x="432" y="512" width="6" height="30" rx="1"/><rect x="442" y="512" width="6" height="30" rx="1"/><rect x="452" y="512" width="6" height="30" rx="1"/><rect x="462" y="512" width="6" height="30" rx="1"/><rect x="472" y="512" width="6" height="30" rx="1"/></g>
    <!-- Divider resistors placed on breadboard -->
    <g id="divider">
      <rect x="520" y="510" width="16" height="36" rx="3" fill="#fef3c7" stroke="#a16207" stroke-width="1.2"/><text x="528" y="542" text-anchor="middle" font-size="6" fill="#713f12">10k</text>
      <rect x="545" y="510" width="16" height="36" rx="3" fill="#fef3c7" stroke="#a16207" stroke-width="1.2"/><text x="553" y="542" text-anchor="middle" font-size="6" fill="#713f12">33k</text>
      <line x1="528" y1="546" x2="528" y2="558" stroke="#ea580c" stroke-width="2"/>
      <line x1="553" y1="546" x2="553" y2="558" stroke="#111827" stroke-width="2"/>
      <line x1="528" y1="510" x2="485" y2="510" stroke="#dc2626" stroke-width="1.6"/>
      <line x1="500" y1="555" x2="223" y2="555" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3"/>
    </g>
    <text x="540" y="568" text-anchor="middle" font-size="7" fill="#9a3412">Divider 10k (top) / 33k (GND) → factor 4.3 → GPIO1</text>
  </g>

  <!-- Wire labels floating -->
  <g font-size="7" font-weight="600">
    <rect x="620" y="228" width="68" height="12" rx="6" fill="#fef3c7" stroke="#eab308"/><text x="654" y="236" text-anchor="middle" fill="#92400e">RX Yellow</text>
    <rect x="620" y="245" width="68" height="12" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="654" y="253" text-anchor="middle" fill="#14532d">TX Green</text>
    <rect x="620" y="262" width="68" height="12" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="654" y="270" text-anchor="middle" fill="#7f1d1d">VCC Rot</text>
    <rect x="620" y="279" width="68" height="12" rx="6" fill="#1f2937" stroke="#111827"/><text x="654" y="287" text-anchor="middle" fill="white">GND Black</text>
  </g>

  <!-- Steps at bottom -->
  <rect x="40" y="590" width="920" height="78" rx="8" fill="white" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="55" y="608" font-size="10" font-weight="700" fill="#111827">Wiring in 4 steps — colors = function</text>
  <g font-size="8.5" fill="#374151">
    <text x="55" y="623"><tspan font-weight="700" fill="#eab308">1. Yellow</tspan> GPIO16 (FireBeetle TX) → A02YYUW RX</text>
    <text x="55" y="635"><tspan font-weight="700" fill="#16a34a">2. Green</tspan> A02YYUW TX → GPIO17 (FireBeetle RX) — don't forget to cross!</text>
    <text x="55" y="647"><tspan font-weight="700" fill="#dc2626">3. Rot</tspan> 3V3 → MOSFET Source (S), MOSFET Drain (D) → Sensor VCC, <tspan font-weight="700" fill="#7c3aed">Lila</tspan> GPIO21 → MOSFET Gate + 10k → GND</text>
    <text x="55" y="659"><tspan font-weight="700">4. Black</tspan> GND rail connects: FireBeetle GND + Sensor GND + Battery − + Divider GND + MOSFET Pulldown</text>
  </g>
  <text x="750" y="623" font-size="8" fill="#6b7280">Wires &lt; 30 cm, twist pairs, IP65 enclosure</text>
  <text x="750" y="635" font-size="8" fill="#6b7280">Fritzing source: docs/fritzing/breadboard.fzz</text>
  <text x="750" y="647" font-size="8" fill="#6b7280">Schematic: docs/schematic.svg / .pdf</text>
  <text x="750" y="659" font-size="8" fill="#6b7280">KiCad: docs/kicad/wassertank.kicad_sch</text>
</svg>
