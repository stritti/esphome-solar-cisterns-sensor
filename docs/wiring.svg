<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Authoritative wiring diagram for the solar cistern sensor</title><desc id="desc">FireBeetle 2 ESP32-C6 connected to A02YYUW through an active-low BC327-40 PNP high-side switch, with battery and solar measurement wiring.</desc>
<defs><style>.box{fill:#fff;stroke:#1f2937;stroke-width:2}.head{fill:#0f172a}.h{font:700 22px sans-serif;fill:#fff}.t{font:16px sans-serif;fill:#111827}.s{font:14px sans-serif;fill:#374151}.pin{font:700 15px monospace;fill:#111827}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1200" height="900" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">Solar cistern sensor: authoritative wiring</text><text x="600" y="68" text-anchor="middle" class="s">FireBeetle 2 ESP32-C6 · A02YYUW · BC327-40 PNP · receive-only UART 9600</text>
<g><rect x="40" y="105" width="320" height="390" rx="12" class="box"/><rect x="40" y="105" width="320" height="52" rx="12" class="head"/><rect x="40" y="140" width="320" height="17" class="head"/><text x="200" y="138" text-anchor="middle" class="h">FireBeetle 2 ESP32-C6</text><text x="65" y="205" class="pin">GPIO16</text><text x="180" y="205" class="s">not used</text><circle cx="350" cy="200" r="6" fill="#94a3b8"/><text x="65" y="255" class="pin">GPIO17 / RX</text><circle cx="350" cy="250" r="6" fill="#16a34a"/><text x="65" y="305" class="pin">GPIO21</text><text x="65" y="324" class="s">active-low sensor control</text><circle cx="350" cy="300" r="6" fill="#7c3aed"/><text x="65" y="365" class="pin">3V3</text><circle cx="350" cy="360" r="6" fill="#dc2626"/><text x="65" y="415" class="pin">GND</text><circle cx="350" cy="410" r="6" fill="#111827"/><text x="65" y="465" class="pin">GPIO1 / ADC</text><circle cx="350" cy="460" r="6" fill="#f97316"/></g>
<g><rect x="475" y="275" width="245" height="205" rx="12" fill="#fffbeb" stroke="#a16207" stroke-width="2"/><text x="598" y="308" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#713f12">BC327-40</text><text x="598" y="332" text-anchor="middle" class="s">PNP high-side switch · TO-92 · optional</text><circle cx="475" cy="360" r="6" fill="#7c3aed"/><text x="495" y="366" class="pin">B</text><circle cx="598" cy="275" r="6" fill="#dc2626"/><text x="615" y="287" class="pin">E</text><circle cx="720" cy="390" r="6" fill="#dc2626"/><text x="680" y="382" class="pin">C</text><path d="M475 360 H555 M570 325 V415 M585 325 V415 M585 390 H720 M585 325 V290 H598 V275" stroke="#111827" stroke-width="4" fill="none"/></g>
<g><rect x="840" y="105" width="320" height="390" rx="12" class="box"/><rect x="840" y="105" width="320" height="52" rx="12" fill="#166534"/><rect x="840" y="140" width="320" height="17" fill="#166534"/><text x="1000" y="138" text-anchor="middle" class="h">A02YYUW</text><text x="865" y="205" class="pin">RX</text><circle cx="850" cy="200" r="6" fill="#dc2626"/><text x="930" y="205" class="s">to switched VCC</text><text x="865" y="255" class="pin">TX</text><circle cx="850" cy="250" r="6" fill="#16a34a"/><text x="930" y="255" class="s">to GPIO17 / RX</text><text x="865" y="365" class="pin">VCC</text><circle cx="850" cy="360" r="6" fill="#dc2626"/><text x="930" y="365" class="s">switched 3.3V</text><text x="865" y="415" class="pin">GND</text><circle cx="850" cy="410" r="6" fill="#111827"/><text x="1000" y="462" text-anchor="middle" class="s">3.3-5V · UART 9600 · 3-450cm</text></g>
<path d="M850 200 H815 V360 H850" class="wire" stroke="#dc2626"/><text x="805" y="180" text-anchor="end" class="s">RX HIGH only while powered</text><path d="M850 250 H350" class="wire" stroke="#16a34a"/><text x="780" y="240" class="s">sensor TX → MCU RX</text><path d="M350 300 H390" class="wire" stroke="#7c3aed"/><rect x="390" y="284" width="70" height="32" rx="4" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="425" y="306" text-anchor="middle" class="pin">4.7k</text><path d="M460 300 H475 V360" class="wire" stroke="#7c3aed"/><path d="M350 360 H430 V260 H598 V275" class="wire" stroke="#dc2626"/><path d="M720 390 H780 V360 H850" class="wire" stroke="#dc2626"/><path d="M350 410 H440 V505 H800 V410 H850" class="wire" stroke="#111827"/>
<g><path d="M475 360 H500 V340 M500 300 V260" stroke="#7c3aed" stroke-width="3"/><rect x="488" y="300" width="24" height="40" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="598" y="458" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#5b21b6">10k pull-up: Base → 3V3</text></g>
<g><rect x="40" y="545" width="330" height="210" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="205" y="580" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e40af">Protected 1-cell Li-ion</text><text x="65" y="620" class="pin">Battery + / -</text><text x="65" y="650" class="t">→ FireBeetle PH2.0</text><text x="65" y="680" class="s">Verify connector polarity against board labels.</text><text x="65" y="714" class="s">GPIO0 battery monitor is internal:</text><text x="65" y="738" class="pin">12dB · multiply 2.0</text></g>
<g><rect x="420" y="545" width="740" height="270" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="790" y="580" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#9a3412">Nominal 5V solar panel</text><text x="450" y="620" class="pin">Solar+ → FireBeetle VIN</text><text x="450" y="650" class="pin">Solar GND → FireBeetle GND</text><text x="450" y="690" class="t">Measurement branch:</text><text x="1000" y="660" text-anchor="middle" class="s">factor 4.3</text><text x="1000" y="684" text-anchor="middle" class="s">5.0V → 1.16V at GPIO1</text><text x="1000" y="708" text-anchor="middle" class="s">ADC: 12dB, multiply 4.3</text><text x="520" y="761" class="pin">Solar+</text><path d="M600 755 H740" class="wire" stroke="#f97316"/><rect x="630" y="738" width="70" height="34" rx="4" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="665" y="761" text-anchor="middle" class="pin">33k</text><circle cx="740" cy="755" r="7" fill="#f97316"/><path d="M740 755 H840" class="wire" stroke="#f97316"/><text x="850" y="761" class="pin">GPIO1</text><path d="M740 755 V802" class="wire" stroke="#111827"/><rect x="724" y="770" width="32" height="30" rx="4" fill="#fff" stroke="#111827" stroke-width="2"/><text x="740" y="791" text-anchor="middle" class="pin">10k</text><text x="770" y="806" class="pin">GND</text></g>
<g><rect x="40" y="835" width="1120" height="45" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="600" y="864" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#991b1b">Optional power gating: GPIO21 LOW = sensor ON · GPIO21 HIGH = sensor OFF · without it connect VCC directly to 3V3</text></g>
</svg>