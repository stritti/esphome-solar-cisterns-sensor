<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" style="background:#ffffff; font-family: 'Inter', Arial, sans-serif;">
  <defs>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#111827"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L7,4 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .label { font-size: 11px; fill: #374151; }
      .pin { font-size: 11px; fill: #111827; font-weight: 600; }
      .wire-label { font-size: 10px; fill: #6b7280; font-style: italic; }
      .note { font-size: 10px; fill: #4b5563; }
    </style>
  </defs>

  <!-- Background grid -->
  <rect x="0" y="0" width="1000" height="800" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" rx="8"/>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" class="title">Solar Water Tank Sensor — ESP32-C6 + A02YYUW</text>
  <text x="500" y="52" text-anchor="middle" class="subtitle">DFRobot FireBeetle 2 ESP32-C6 (DFR1075) • Deep-Sleep • IRLML6401 High-Side Switch • KiCad Quelle: docs/kicad/</text>

  <!-- ===== FireBeetle 2 ESP32-C6 Block ===== -->
  <rect x="40" y="85" width="240" height="360" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <rect x="40" y="85" width="240" height="38" rx="10" fill="#111827"/>
  <rect x="40" y="105" width="240" height="18" fill="#111827"/>
  <text x="160" y="108" text-anchor="middle" fill="white" font-size="13" font-weight="700">FireBeetle 2 ESP32-C6</text>
  <text x="160" y="120" text-anchor="middle" fill="#9ca3af" font-size="9">DFR1075 • 3.3V • PH2.0 Battery</text>

  <!-- Pin rows left side -->
  <!-- GPIO16 TX -->
  <circle cx="55" cy="150" r="5" fill="white" stroke="#eab308" stroke-width="2"/>
  <text x="67" y="154" class="pin">GPIO16</text><text x="130" y="154" class="label">TX1 → Sensor RX</text><text x="220" y="154" class="label" text-anchor="end" fill="#eab308">↗ Yellow</text>
  <!-- GPIO17 RX -->
  <circle cx="55" cy="175" r="5" fill="white" stroke="#16a34a" stroke-width="2"/>
  <text x="67" y="179" class="pin">GPIO17</text><text x="130" y="179" class="label">RX1 ← Sensor TX</text><text x="220" y="179" class="label" text-anchor="end" fill="#16a34a">↗ Green</text>
  <!-- GPIO21 -->
  <circle cx="55" cy="210" r="5" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <text x="67" y="214" class="pin">GPIO21</text><text x="130" y="214" class="label">MOSFET Gate</text><text x="220" y="214" class="label" text-anchor="end" fill="#7c3aed">Lila</text>
  <!-- GPIO0 -->
  <circle cx="55" cy="250" r="5" fill="white" stroke="#2563eb" stroke-width="2"/>
  <text x="67" y="254" class="pin">GPIO0 (A0)</text><text x="135" y="254" class="label">Battery ADC</text><text x="220" y="254" class="label" text-anchor="end" fill="#2563eb">interner Teiler</text>
  <!-- GPIO1 -->
  <circle cx="55" cy="275" r="5" fill="white" stroke="#ea580c" stroke-width="2"/>
  <text x="67" y="279" class="pin">GPIO1 (A1)</text><text x="135" y="279" class="label">Solar ADC</text><text x="220" y="279" class="label" text-anchor="end" fill="#ea580c">Teiler 4.3</text>
  <!-- GND -->
  <circle cx="55" cy="315" r="5" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="67" y="319" class="pin">GND</text><text x="130" y="319" class="label">Ground</text>
  <!-- 3.3V -->
  <circle cx="55" cy="340" r="5" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
  <text x="67" y="344" class="pin">3V3</text><text x="130" y="344" class="label">→ MOSFET Source</text>
  <!-- PH2.0 -->
  <rect x="50" y="365" width="220" height="62" rx="6" fill="white" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="160" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">PH2.0 — Li-Ion 18650</text>
  <text x="65" y="395" font-size="10" fill="#374151">+ BAT (3.0–4.2V)</text><text x="210" y="395" font-size="10" fill="#dc2626">→ 3V3 LDO</text>
  <text x="65" y="410" font-size="10" fill="#374151">− BAT</text><text x="210" y="410" font-size="10" fill="#111827">→ GND</text>

  <!-- ===== MOSFET P-Channel IRLML6401 Symbol (proper) ===== -->
  <g id="mosfet">
    <rect x="400" y="160" width="140" height="150" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="1.8"/>
    <text x="470" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">IRLML6401</text>
    <text x="470" y="190" text-anchor="middle" font-size="9" fill="#a16207">P-Channel • High-Side</text>
    <!-- MOSFET symbol: vertical channel line -->
    <line x1="470" y1="210" x2="470" y2="285" stroke="#111827" stroke-width="2.5"/>
    <!-- Source arrow (P-Channel: arrow towards channel) -->
    <polygon points="455,225 470,235 485,225" fill="none" stroke="#111827" stroke-width="1.6"/>
    <line x1="470" y1="235" x2="485" y2="235" stroke="#111827" stroke-width="1.6"/>
    <!-- Gate line -->
    <line x1="430" y1="245" x2="462" y2="245" stroke="#111827" stroke-width="2"/>
    <!-- Gate vertical -->
    <line x1="462" y1="215" x2="462" y2="275" stroke="#111827" stroke-width="2"/>
    <!-- Source to 3V3 -->
    <line x1="470" y1="210" x2="510" y2="210" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="510" cy="210" r="3.2" fill="#dc2626"/>
    <text x="515" y="207" font-size="10" font-weight="600" fill="#dc2626">S</text>
    <!-- Drain to sensor VCC -->
    <line x1="470" y1="285" x2="510" y2="285" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="510" cy="285" r="3.2" fill="#dc2626"/>
    <text x="515" y="288" font-size="10" font-weight="600" fill="#dc2626">D</text>
    <!-- Gate label -->
    <text x="410" y="243" font-size="9" fill="#7c3aed" font-weight="600">G</text>
    <!-- Pulldown resistor -->
    <rect x="435" y="258" width="28" height="12" rx="2" fill="white" stroke="#7c3aed" stroke-width="1.2" transform="rotate(-90 449 264)"/>
    <text x="452" y="286" font-size="8" fill="#7c3aed">10k → GND</text>
  </g>

  <!-- ===== A02YYUW Sensor Block ===== -->
  <rect x="660" y="85" width="260" height="230" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <rect x="660" y="85" width="260" height="38" rx="10" fill="#15803d"/>
  <rect x="660" y="105" width="260" height="18" fill="#15803d"/>
  <text x="790" y="108" text-anchor="middle" fill="white" font-size="13" font-weight="700">A02YYUW</text>
  <text x="790" y="120" text-anchor="middle" fill="#bbf7d0" font-size="9">Ultrasonic • 3–450 cm • UART 9600 • IP67</text>

  <!-- Sensor pins -->
  <g font-size="11">
    <circle cx="675" cy="150" r="5" fill="#dc2626" stroke="#dc2626"/><text x="687" y="154" font-weight="600">VCC</text><text x="735" y="154" fill="#6b7280">Rot</text><text x="770" y="154" font-size="10" fill="#374151">↩ MOSFET D</text>
    <circle cx="675" cy="175" r="5" fill="#111827"/><text x="687" y="179" font-weight="600">GND</text><text x="735" y="179" fill="#6b7280">Black</text>
    <circle cx="675" cy="200" r="5" fill="white" stroke="#eab308" stroke-width="2"/><text x="687" y="204" font-weight="600">RX</text><text x="735" y="204" fill="#6b7280">Yellow</text><text x="770" y="204" font-size="10" fill="#374151">← GPIO16 TX</text>
    <circle cx="675" cy="225" r="5" fill="white" stroke="#16a34a" stroke-width="2"/><text x="687" y="229" font-weight="600">TX</text><text x="735" y="229" fill="#6b7280">Green</text><text x="770" y="229" font-size="10" fill="#374151">→ GPIO17 RX</text>
  </g>
  <!-- IP67 note -->
  <rect x="675" y="245" width="230" height="52" rx="6" fill="white" stroke="#bbf7d0" stroke-width="1"/>
  <text x="790" y="260" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">Note: RX/TX cross!</text>
  <text x="790" y="272" text-anchor="middle" font-size="9" fill="#4b5563">Sensor RX ← MCU TX (GPIO16)</text>
  <text x="790" y="284" text-anchor="middle" font-size="9" fill="#4b5563">Sensor TX → MCU RX (GPIO17)</text>

  <!-- ===== Wires — UART (crossed correctly) ===== -->
  <!-- GPIO16 TX -> Sensor RX (yellow) -->
  <path d="M 280 150 H 380 C 400 150 420 150 430 165 L 430 200 H 660" fill="none" stroke="#eab308" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="660,197 660,203 666,200" fill="#eab308"/>
  <text x="460" y="145" class="wire-label" fill="#a16207">UART TX (9600 baud)</text>

  <!-- GPIO17 RX <- Sensor TX (green) -->
  <path d="M 660 225 H 440 C 425 225 410 225 400 210 L 380 190 H 280" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="8 4"/>
  <polygon points="286,187 286,193 280,190" fill="#16a34a"/>
  <text x="460" y="238" class="wire-label" fill="#15803d">UART RX (9600 baud)</text>

  <!-- ===== Power path: 3V3 -> MOSFET Source ===== -->
  <path d="M 280 340 H 360 V 210 H 470" fill="none" stroke="#dc2626" stroke-width="2.6"/>
  <circle cx="360" cy="210" r="4" fill="#dc2626"/>
  <text x="320" y="335" class="wire-label" fill="#dc2626">3V3 (via LDO)</text>

  <!-- GPIO21 -> MOSFET Gate (violet) -->
  <path d="M 280 210 H 430" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
  <circle cx="430" cy="210" r="2.5" fill="#7c3aed"/>
  <!-- Pulldown vertical to GND -->
  <path d="M 449 270 V 340 H 280" fill="none" stroke="#111827" stroke-width="1.8" stroke-dasharray="5 4"/>
  <!-- GND symbol at pulldown -->
  <g transform="translate(449,300)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#111827" stroke-width="1.8"/>
    <line x1="-8" y1="5" x2="8" y2="5" stroke="#111827" stroke-width="1.8"/>
    <line x1="-4" y1="10" x2="4" y2="10" stroke="#111827" stroke-width="1.8"/>
  </g>

  <!-- MOSFET Drain -> Sensor VCC -->
  <path d="M 540 285 H 660" fill="none" stroke="#dc2626" stroke-width="2.6"/>
  <text x="545" y="275" class="wire-label" fill="#dc2626">Sensor VCC (switched)</text>

  <!-- GND common -->
  <path d="M 280 315 H 200 V 520 H 760 V 175" fill="none" stroke="#111827" stroke-width="2.2"/>
  <circle cx="200" cy="315" r="4" fill="#111827"/>
  <circle cx="760" cy="175" r="3" fill="#111827"/>
  <!-- GND symbols -->
  <g transform="translate(200,340)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#111827" stroke-width="1.8"/>
    <line x1="-8" y1="5" x2="8" y2="5" stroke="#111827" stroke-width="1.8"/>
    <line x1="-4" y1="10" x2="4" y2="10" stroke="#111827" stroke-width="1.8"/>
  </g>
  <g transform="translate(760,190)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#111827" stroke-width="1.8"/>
    <line x1="-8" y1="5" x2="8" y2="5" stroke="#111827" stroke-width="1.8"/>
    <line x1="-4" y1="10" x2="4" y2="10" stroke="#111827" stroke-width="1.8"/>
  </g>
  <text x="210" y="355" class="wire-label" fill="#111827">GND (gemeinsam)</text>

  <!-- ===== Battery 18650 + PH2.0 ===== -->
  <g id="battery">
    <rect x="40" y="500" width="320" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="200" y="520" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">18650 Li-Ion 3.7V (2000–3500 mAh)</text>
    <!-- Battery symbol -->
    <g transform="translate(70,540)">
      <rect x="0" y="5" width="50" height="26" rx="2" fill="white" stroke="#1e40af" stroke-width="1.6"/>
      <rect x="52" y="13" width="6" height="10" rx="1" fill="#1e40af"/>
      <text x="25" y="23" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af">BAT</text>
    </g>
    <text x="140" y="552" font-size="11" font-weight="600" fill="#1e40af">+ 3.0–4.2V</text><text x="140" y="565" font-size="10" fill="#4b5563">PH2.0 → FireBeetle</text>
    <text x="140" y="580" font-size="10" fill="#1e40af">− → GND</text>
    <!-- Connection line vivid -->
    <path d="M 140 548 H 200 V 445" fill="none" stroke="#2563eb" stroke-width="2.2"/>
    <path d="M 140 576 H 160 V 520 H 200" fill="none" stroke="#111827" stroke-width="1.8"/>
  </g>

  <!-- ===== Solar + Divider ===== -->
  <g id="solar">
    <rect x="400" y="500" width="280" height="110" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <text x="540" y="520" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Solar Panel 5–6V (optional)</text>
    <text x="540" y="533" text-anchor="middle" font-size="9" fill="#c2410c">10W empfohlen • TP4056 möglich</text>
    <!-- Solar symbol -->
    <g transform="translate(420,540)">
      <rect x="0" y="0" width="48" height="36" rx="2" fill="#ea580c" stroke="#9a3412" stroke-width="1.4"/>
      <line x1="8" y1="8" x2="8" y2="28" stroke="white" stroke-width="1.2"/><line x1="16" y1="8" x2="16" y2="28" stroke="white" stroke-width="1.2"/><line x1="24" y1="8" x2="24" y2="28" stroke="white" stroke-width="1.2"/><line x1="32" y1="8" x2="32" y2="28" stroke="white" stroke-width="1.2"/><line x1="40" y1="8" x2="40" y2="28" stroke="white" stroke-width="1.2"/>
    </g>
    <!-- Divider -->
    <g transform="translate(490,540)">
      <rect x="0" y="0" width="14" height="28" rx="2" fill="white" stroke="#ea580c" stroke-width="1.4"/><text x="7" y="44" text-anchor="middle" font-size="8" fill="#9a3412">10k</text>
      <line x1="7" y1="28" x2="7" y2="42" stroke="#ea580c" stroke-width="2"/><circle cx="7" cy="42" r="2.5" fill="#ea580c"/>
      <rect x="30" y="0" width="14" height="28" rx="2" fill="white" stroke="#ea580c" stroke-width="1.4"/><text x="37" y="44" text-anchor="middle" font-size="8" fill="#9a3412">33k</text>
      <text x="22" y="58" text-anchor="middle" font-size="8" fill="#ea580c">→ GPIO1 (A1)</text>
      <!-- GND for divider -->
      <g transform="translate(37,48)">
        <line x1="-8" y1="0" x2="8" y2="0" stroke="#111827" stroke-width="1.4"/><line x1="-5" y1="4" x2="5" y2="4" stroke="#111827" stroke-width="1.4"/>
      </g>
    </g>
    <text x="475" y="590" font-size="9" fill="#9a3412">Divider factor 4.3 • max ~16.5V → 1.1V ref</text>
    <!-- Line to GPIO1 -->
    <path d="M 497 582 V 590 H 240 V 275" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="240" cy="275" r="3" fill="#ea580c"/>
  </g>

  <!-- ===== Legend ===== -->
  <rect x="40" y="635" width="640" height="105" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="55" y="655" font-size="11" font-weight="700" fill="#111827">Legend &amp; Notes</text>
  <g font-size="10" fill="#374151">
    <rect x="55" y="662" width="18" height="4" rx="1" fill="#dc2626"/><text x="78" y="667"> Power 3.3V / VCC (switched)</text>
    <rect x="220" y="662" width="18" height="4" rx="1" fill="#111827"/><text x="243" y="667"> GND</text>
    <rect x="295" y="662" width="18" height="4" rx="1" fill="#eab308"/><text x="318" y="667"> UART TX (Yellow)</text>
    <rect x="430" y="662" width="18" height="4" rx="1" fill="#16a34a"/><text x="453" y="667"> UART RX (Green)</text>

    <rect x="55" y="675" width="18" height="4" rx="1" fill="#7c3aed"/><text x="78" y="680"> Gate-Steuer (GPIO21)</text>
    <rect x="220" y="675" width="18" height="4" rx="1" fill="#2563eb"/><text x="243" y="680"> Battery ADC (GPIO0)</text>
    <rect x="360" y="675" width="18" height="4" rx="1" fill="#ea580c"/><text x="383" y="680"> Solar ADC (GPIO1)</text>
  </g>
  <text x="55" y="698" font-size="9.5" fill="#4b5563">• GPIO16/17 are reserved for UART — never reuse! • Sensor draws ~50 mA → switch only via IRLML6401 (P-Ch), 10k pulldown prevents floating in deep-sleep.</text>
  <text x="55" y="712" font-size="9.5" fill="#4b5563">• Battery directly to PH2.0, internal divider on GPIO0 (1.1V ref, 0 dB). • Solar divider 10k (top) + 33k (GND) → max 16.5V safe, factor 4.3 in YAML.</text>
  <text x="55" y="726" font-size="9.5" fill="#b45309">⚠ IRLML6401 is P-Channel — was incorrectly labeled as N-Channel in old README (corrected).</text>

  <!-- ===== Side notes ===== -->
  <rect x="700" y="480" width="260" height="260" rx="10" fill="white" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="830" y="502" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Wiring short &amp; unambiguous</text>
  <g font-size="10" fill="#374151">
    <text x="715" y="522" font-weight="600">1. FireBeetle ↔ A02YYUW</text>
    <text x="715" y="535">GPIO16 (TX) → RX yellow, GPIO17 (RX) ← TX green</text>
    <text x="715" y="548">GND ↔ GND black, VCC red via MOSFET</text>
    <text x="715" y="566" font-weight="600">2. Power-Gating</text>
    <text x="715" y="579">GPIO21 HIGH → MOSFET AN, Sensor an</text>
    <text x="715" y="592">Deep-Sleep: GPIO21 LOW → Sensor aus (~50 mA gespart)</text>
    <text x="715" y="610" font-weight="600">3. Messung</text>
    <text x="715" y="623">Battery: GPIO0 internal, 0–4.5V</text>
    <text x="715" y="636">Solar: GPIO1 via divider, factor 4.3</text>
    <text x="715" y="654" font-weight="600">4. Einbau</text>
    <text x="715" y="667">Sensor senkrecht über Wasser, IP65-Gehäuse</text>
    <text x="715" y="680">Kabel &lt; 30 cm kurz halten, verdrillen</text>
    <text x="715" y="698" font-size="9" fill="#6b7280">Source: docs/kicad/wassertank.kicad_sch</text>
    <text x="715" y="711" font-size="9" fill="#6b7280">Export: docs/schematic.pdf + Fritzing: docs/fritzing/</text>
    <text x="715" y="724" font-size="8" fill="#9ca3af">v2.1 — 2026-08-25</text>
  </g>

  <!-- Footer line -->
  <line x1="40" y1="755" x2="960" y2="755" stroke="#e5e7eb" stroke-width="1"/>
  <text x="40" y="770" font-size="9" fill="#9ca3af">CC BY-SA • esphome-solar-cisterns-sensor • FireBeetle 2 ESP32-C6 • A02YYUW UART 9600  • Deep-Sleep ~5 µA</text>
  <text x="960" y="770" text-anchor="end" font-size="9" fill="#9ca3af">docs/schematic.svg — vector, zoomable, printable</text>
</svg>
